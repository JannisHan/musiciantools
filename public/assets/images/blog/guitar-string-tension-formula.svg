<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <rect width="1200" height="760" fill="#f6f2ea"/>
  <rect x="56" y="56" width="1088" height="648" rx="10" fill="#fffcf7" stroke="#cfc7ba" stroke-width="2"/>
  <text x="96" y="122" fill="#a9430a" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="3">STRING TENSION MODEL</text>
  <text x="96" y="190" fill="#071c34" font-family="Arial, sans-serif" font-size="50" font-weight="700">T = UW × (2 × L × F)² ÷ 386.4</text>
  <line x1="116" y1="430" x2="1084" y2="430" stroke="#071c34" stroke-width="8"/>
  <path d="M116 398v64M1084 398v64" stroke="#a9430a" stroke-width="8"/>
  <circle cx="300" cy="430" r="18" fill="#a9430a"/>
  <circle cx="600" cy="430" r="18" fill="#08686b"/>
  <circle cx="900" cy="430" r="18" fill="#0e693d"/>
  <text x="244" y="508" fill="#071c34" font-family="Arial, sans-serif" font-size="28" font-weight="700">UNIT WEIGHT</text>
  <text x="287" y="544" fill="#596573" font-family="Arial, sans-serif" font-size="22">UW</text>
  <text x="536" y="508" fill="#071c34" font-family="Arial, sans-serif" font-size="28" font-weight="700">SCALE</text>
  <text x="576" y="544" fill="#596573" font-family="Arial, sans-serif" font-size="22">L</text>
  <text x="836" y="508" fill="#071c34" font-family="Arial, sans-serif" font-size="28" font-weight="700">PITCH</text>
  <text x="892" y="544" fill="#596573" font-family="Arial, sans-serif" font-size="22">F</text>
  <text x="96" y="646" fill="#596573" font-family="Arial, sans-serif" font-size="22">Exact string data + vibrating length + target frequency = tension in pounds-force</text>
</svg>
